  # Slice a two-colour cube through every shipped printer, and through every
  # system process/filament whose templates no printer's own slice reaches, so
  # every custom g-code and filename_format shipped is expanded (names in {if}
  # branches not taken included) - catches slicing regressions the static
  # profile checks and unit tests can't see.
  # Profile-only PRs are covered by check_profiles.yml's nightly binary; this
  # covers src/engine PRs with the PR-built binary.
  slice_check_linux:
    name: Slice check (Linux ${{ vars.SELF_HOSTED && 'x86_64' || 'aarch64' }})
    needs: build_linux
    if: ${{ !cancelled() && success() }}
    # Follows whichever Linux leg built the validator.
    runs-on: ${{ vars.SELF_HOSTED && 'orca-lnx-server' || 'ubuntu-24.04-arm' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Download profile validator
        uses: actions/download-artifact@v8
        with:
          name: ${{ github.sha }}-profile-validator-linux-${{ vars.SELF_HOSTED && 'x86_64' || 'aarch64' }}
          path: validator-bin
      - name: Validate slice (expand custom g-code)
        timeout-minutes: 60
        run: |
          chmod +x validator-bin/Snapmaker_Orca_profile_validator
          ./validator-bin/Snapmaker_Orca_profile_validator -p "${{ github.workspace }}/resources/profiles" -s -l 2
